<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Detalle Solicitud - Mesa de Ayuda Lite</title>
  <link rel="stylesheet" href="styles.css">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body>
  <div class="app-container">
    <!-- SIDEBAR -->
    <aside class="sidebar" id="sidebar">
      <div class="sidebar-header">
        <h1>
          <span><i class="fas fa-headset"></i></span>
          Mesa de Ayuda
        </h1>
      </div>
      
      <nav class="sidebar-nav">
        <a href="dashboard.html" class="nav-item">
          <i class="fas fa-chart-pie"></i>
          Dashboard
        </a>
        <a href="solicitudes.html" class="nav-item active">
          <i class="fas fa-ticket-alt"></i>
          Solicitudes
        </a>
        <a href="nueva-solicitud.html" class="nav-item">
          <i class="fas fa-plus-circle"></i>
          Nueva Solicitud
        </a>
      </nav>
      
      <div class="sidebar-footer">
        <div class="user-info">
          <div class="user-avatar" id="userAvatar">A</div>
          <div class="user-details">
            <div class="user-name" id="userName">Administrador</div>
            <div class="user-role" id="userRole">Admin</div>
          </div>
        </div>
        <button class="btn-logout" onclick="Auth.logout()">
          <i class="fas fa-sign-out-alt"></i>
          Cerrar Sesion
        </button>
      </div>
    </aside>

    <!-- MAIN CONTENT -->
    <main class="main-content">
      <div class="page-header" style="display: flex; justify-content: space-between; align-items: center">
        <div>
          <h2 id="pageTitle">Detalle de Solicitud</h2>
          <p id="pageSubtitle">Informacion completa de la solicitud</p>
        </div>
        <div class="btn-group">
          <a href="solicitudes.html" class="btn btn-outline">
            <i class="fas fa-arrow-left"></i>
            Volver
          </a>
          <a href="#" id="btnEditar" class="btn btn-primary">
            <i class="fas fa-edit"></i>
            Editar
          </a>
        </div>
      </div>

      <div id="alertContainer"></div>

      <!-- Loading -->
      <div id="loadingContainer">
        <div class="loading">
          <div class="spinner"></div>
        </div>
      </div>

      <!-- Content -->
      <div id="contentContainer" class="hidden">
        <!-- Info Principal -->
        <div class="card mb-2">
          <div class="card-header">
            <h3><i class="fas fa-info-circle"></i> Informacion de la Solicitud</h3>
            <div id="estadoBadgeContainer"></div>
          </div>
          <div class="card-body">
            <div class="detail-grid">
              <div class="detail-item">
                <label>Codigo</label>
                <div class="value" id="detCodigo">-</div>
              </div>
              <div class="detail-item">
                <label>Fecha de Registro</label>
                <div class="value" id="detFecha">-</div>
              </div>
              <div class="detail-item">
                <label>Tipo</label>
                <div class="value" id="detTipo">-</div>
              </div>
              <div class="detail-item">
                <label>Prioridad</label>
                <div class="value" id="detPrioridad">-</div>
              </div>
              <div class="detail-item detail-full">
                <label>Titulo</label>
                <div class="value" id="detTitulo">-</div>
              </div>
              <div class="detail-item detail-full">
                <label>Descripcion</label>
                <div class="value" id="detDescripcion" style="white-space: pre-wrap">-</div>
              </div>
            </div>
          </div>
        </div>

        <!-- Datos del Solicitante -->
        <div class="card mb-2">
          <div class="card-header">
            <h3><i class="fas fa-user"></i> Datos del Solicitante</h3>
          </div>
          <div class="card-body">
            <div class="detail-grid">
              <div class="detail-item">
                <label>Nombre</label>
                <div class="value" id="detSolicitanteNombre">-</div>
              </div>
              <div class="detail-item">
                <label>Correo Electronico</label>
                <div class="value" id="detSolicitanteEmail">-</div>
              </div>
            </div>
          </div>
        </div>

        <!-- Cambiar Estado -->
        <div class="card mb-2" id="cambiarEstadoCard">
          <div class="card-header">
            <h3><i class="fas fa-exchange-alt"></i> Cambiar Estado</h3>
          </div>
          <div class="card-body">
            <div class="form-row">
              <div class="form-group">
                <label for="nuevoEstado">Nuevo Estado</label>
                <select id="nuevoEstado" class="form-control">
                  <option value="">Seleccione un estado</option>
                </select>
              </div>
            </div>
            <button class="btn btn-success" id="btnCambiarEstado">
              <i class="fas fa-check"></i>
              Actualizar Estado
            </button>
          </div>
        </div>
      </div>
    </main>
  </div>

  <script src="app.js"></script>
  <script>
    // Verificar autenticacion
    Auth.requireAuth();

    // Cargar datos del usuario
    const user = Auth.getUser();
    if (user) {
      document.getElementById('userName').textContent = user.nombre;
      document.getElementById('userRole').textContent = user.rol;
      document.getElementById('userAvatar').textContent = user.nombre.charAt(0).toUpperCase();
    }

    // Obtener ID de la URL
    const urlParams = new URLSearchParams(window.location.search);
    const solicitudId = urlParams.get('id');

    if (!solicitudId) {
      window.location.href = 'solicitudes.html';
    }

    let solicitudActual = null;

    // Flujo de estados permitidos
    const flujoEstados = {
      'Registrada': ['En Proceso', 'Anulada'],
      'En Proceso': ['Registrada', 'Resuelta', 'Anulada'],
      'Resuelta': ['En Proceso', 'Cerrada'],
      'Cerrada': [],
      'Anulada': []
    };

    // Cargar solicitud
    async function loadSolicitud() {
      try {
        const response = await API.get(`/api/solicitudes/${solicitudId}`);
        
        if (response.success) {
          solicitudActual = response.data;
          renderSolicitud(solicitudActual);
          document.getElementById('loadingContainer').classList.add('hidden');
          document.getElementById('contentContainer').classList.remove('hidden');
        }
      } catch (error) {
        showAlert('alertContainer', 'Error al cargar la solicitud.', 'danger');
        document.getElementById('loadingContainer').innerHTML = `
          <div class="empty-state">
            <i class="fas fa-exclamation-circle"></i>
            <h4>Error</h4>
            <p>No se pudo cargar la solicitud.</p>
          </div>
        `;
      }
    }

    function renderSolicitud(sol) {
      // Actualizar titulo de pagina
      document.getElementById('pageTitle').textContent = sol.codigo;
      document.getElementById('pageSubtitle').textContent = sol.titulo;
      document.getElementById('btnEditar').href = `editar-solicitud.html?id=${sol._id}`;
      
      // Info principal
      document.getElementById('detCodigo').textContent = sol.codigo;
      document.getElementById('detFecha').textContent = formatDate(sol.fechaCreacion);
      document.getElementById('detTipo').textContent = sol.tipo;
      document.getElementById('detPrioridad').innerHTML = 
        `<span class="badge badge-${sol.prioridad.toLowerCase()}">${sol.prioridad}</span>`;
      document.getElementById('detTitulo').textContent = sol.titulo;
      document.getElementById('detDescripcion').textContent = sol.descripcion;
      
      // Estado badge
      document.getElementById('estadoBadgeContainer').innerHTML = 
        `<span class="badge badge-${sol.estado.toLowerCase().replace(' ', '-')}">${sol.estado}</span>`;
      
      // Solicitante
      document.getElementById('detSolicitanteNombre').textContent = sol.solicitante.nombre;
      document.getElementById('detSolicitanteEmail').textContent = sol.solicitante.email;
      
      // Select de nuevo estado
      const selectEstado = document.getElementById('nuevoEstado');
      const estadosPermitidos = flujoEstados[sol.estado] || [];
      
      if (estadosPermitidos.length === 0) {
        document.getElementById('cambiarEstadoCard').classList.add('hidden');
      } else {
        selectEstado.innerHTML = '<option value="">Seleccione un estado</option>' +
          estadosPermitidos.map(e => `<option value="${e}">${e}</option>`).join('');
      }
    }

    // Cambiar estado
    document.getElementById('btnCambiarEstado').addEventListener('click', async () => {
      const nuevoEstado = document.getElementById('nuevoEstado').value;
      
      if (!nuevoEstado) {
        showAlert('alertContainer', 'Seleccione un nuevo estado.', 'warning');
        return;
      }
      
      try {
        const response = await API.put(`/api/solicitudes/${solicitudId}`, {
          estado: nuevoEstado
        });
        
        if (response.success) {
          showAlert('alertContainer', 'Estado actualizado correctamente.', 'success');
          loadSolicitud();
        }
      } catch (error) {
        showAlert('alertContainer', error.message || 'Error al actualizar el estado.', 'danger');
      }
    });

    // Inicializar
    loadSolicitud();
  </script>
</body>
</html>
