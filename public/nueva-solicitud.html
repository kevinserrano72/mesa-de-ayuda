<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Nueva Solicitud - Mesa de Ayuda Lite</title>
  <link rel="stylesheet" href="styles.css">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body>
  <div class="app-container">
    <!-- SIDEBAR -->
    <aside class="sidebar" id="sidebar">
      <div class="sidebar-header">
        <h1>
          <span><i class="fas fa-headset"></i></span>
          Mesa de Ayuda
        </h1>
      </div>
      
      <nav class="sidebar-nav">
        <a href="dashboard.html" class="nav-item">
          <i class="fas fa-chart-pie"></i>
          Dashboard
        </a>
        <a href="solicitudes.html" class="nav-item">
          <i class="fas fa-ticket-alt"></i>
          Solicitudes
        </a>
        <a href="nueva-solicitud.html" class="nav-item active">
          <i class="fas fa-plus-circle"></i>
          Nueva Solicitud
        </a>
      </nav>
      
      <div class="sidebar-footer">
        <div class="user-info">
          <div class="user-avatar" id="userAvatar">A</div>
          <div class="user-details">
            <div class="user-name" id="userName">Administrador</div>
            <div class="user-role" id="userRole">Admin</div>
          </div>
        </div>
        <button class="btn-logout" onclick="Auth.logout()">
          <i class="fas fa-sign-out-alt"></i>
          Cerrar Sesion
        </button>
      </div>
    </aside>

    <!-- ============================================
         MAIN CONTENT - RF02 Registrar Solicitud
         ============================================ -->
    <main class="main-content">
      <div class="page-header">
        <h2>Nueva Solicitud de Soporte</h2>
        <p>Registre una nueva solicitud en el sistema</p>
      </div>

      <div id="alertContainer"></div>

      <div class="card">
        <div class="card-header">
          <h3><i class="fas fa-file-alt"></i> Datos de la Solicitud</h3>
        </div>
        <div class="card-body">
          <form id="solicitudForm">
            <!-- Titulo -->
            <div class="form-group">
              <label for="titulo">Titulo de la Solicitud <span class="required">*</span></label>
              <input 
                type="text" 
                id="titulo" 
                class="form-control" 
                placeholder="Describa brevemente el problema o solicitud"
                maxlength="200"
                required
              >
              <div class="form-error" id="tituloError"></div>
            </div>

            <!-- Descripcion -->
            <div class="form-group">
              <label for="descripcion">Descripcion Detallada <span class="required">*</span></label>
              <textarea 
                id="descripcion" 
                class="form-control" 
                placeholder="Proporcione todos los detalles relevantes de la solicitud..."
                rows="4"
                maxlength="2000"
                required
              ></textarea>
              <div class="form-error" id="descripcionError"></div>
            </div>

            <!-- Tipo y Prioridad -->
            <div class="form-row">
              <div class="form-group">
                <label for="tipo">Tipo de Solicitud <span class="required">*</span></label>
                <select id="tipo" class="form-control" required>
                  <option value="">Seleccione un tipo</option>
                  <option value="Soporte Tecnico">Soporte Tecnico</option>
                  <option value="Falla de Sistema">Falla de Sistema</option>
                  <option value="Solicitud de Acceso">Solicitud de Acceso</option>
                  <option value="Mantenimiento">Mantenimiento</option>
                  <option value="Consulta General">Consulta General</option>
                </select>
                <div class="form-error" id="tipoError"></div>
              </div>

              <div class="form-group">
                <label for="prioridad">Prioridad <span class="required">*</span></label>
                <select id="prioridad" class="form-control" required>
                  <option value="Baja">Baja</option>
                  <option value="Media" selected>Media</option>
                  <option value="Alta">Alta</option>
                  <option value="Critica">Critica</option>
                </select>
                <div class="form-error" id="prioridadError"></div>
              </div>
            </div>

            <hr style="margin: 1.5rem 0; border: none; border-top: 1px solid var(--border)">

            <h4 style="margin-bottom: 1rem; color: var(--text-primary)">
              <i class="fas fa-user"></i> Datos del Solicitante
            </h4>

            <!-- Datos del Solicitante -->
            <div class="form-row">
              <div class="form-group">
                <label for="solicitanteNombre">Nombre Completo <span class="required">*</span></label>
                <input 
                  type="text" 
                  id="solicitanteNombre" 
                  class="form-control" 
                  placeholder="Nombre del solicitante"
                  required
                >
                <div class="form-error" id="solicitanteNombreError"></div>
              </div>

              <div class="form-group">
                <label for="solicitanteEmail">Correo Electronico <span class="required">*</span></label>
                <input 
                  type="email" 
                  id="solicitanteEmail" 
                  class="form-control" 
                  placeholder="correo@ejemplo.com"
                  required
                >
                <div class="form-error" id="solicitanteEmailError"></div>
              </div>
            </div>

            <!-- Botones -->
            <div class="btn-group" style="margin-top: 1.5rem">
              <button type="submit" class="btn btn-primary" id="btnGuardar">
                <i class="fas fa-save"></i>
                Guardar Solicitud
              </button>
              <button type="button" class="btn btn-outline" onclick="limpiarFormulario()">
                <i class="fas fa-eraser"></i>
                Limpiar
              </button>
              <a href="solicitudes.html" class="btn btn-secondary">
                <i class="fas fa-times"></i>
                Cancelar
              </a>
            </div>
          </form>
        </div>
      </div>
    </main>
  </div>

  <script src="app.js"></script>
  <script>
    // Verificar autenticacion
    Auth.requireAuth();

    // Cargar datos del usuario
    const user = Auth.getUser();
    if (user) {
      document.getElementById('userName').textContent = user.nombre;
      document.getElementById('userRole').textContent = user.rol;
      document.getElementById('userAvatar').textContent = user.nombre.charAt(0).toUpperCase();
    }

    // Limpiar formulario
    function limpiarFormulario() {
      document.getElementById('solicitudForm').reset();
      document.querySelectorAll('.form-error').forEach(el => el.textContent = '');
      document.querySelectorAll('.form-control').forEach(el => el.classList.remove('error'));
    }

    // Manejar envio del formulario
    document.getElementById('solicitudForm').addEventListener('submit', async (e) => {
      e.preventDefault();
      
      // Obtener valores
      const titulo = document.getElementById('titulo').value.trim();
      const descripcion = document.getElementById('descripcion').value.trim();
      const tipo = document.getElementById('tipo').value;
      const prioridad = document.getElementById('prioridad').value;
      const solicitanteNombre = document.getElementById('solicitanteNombre').value.trim();
      const solicitanteEmail = document.getElementById('solicitanteEmail').value.trim();
      
      // Limpiar errores
      document.querySelectorAll('.form-error').forEach(el => el.textContent = '');
      document.querySelectorAll('.form-control').forEach(el => el.classList.remove('error'));
      
      // Validaciones
      let hasError = false;
      
      if (!titulo || titulo.length < 5) {
        document.getElementById('tituloError').textContent = 'El titulo debe tener al menos 5 caracteres.';
        document.getElementById('titulo').classList.add('error');
        hasError = true;
      }
      
      if (!descripcion || descripcion.length < 10) {
        document.getElementById('descripcionError').textContent = 'La descripcion debe tener al menos 10 caracteres.';
        document.getElementById('descripcion').classList.add('error');
        hasError = true;
      }
      
      if (!tipo) {
        document.getElementById('tipoError').textContent = 'Seleccione un tipo de solicitud.';
        document.getElementById('tipo').classList.add('error');
        hasError = true;
      }
      
      if (!solicitanteNombre) {
        document.getElementById('solicitanteNombreError').textContent = 'El nombre del solicitante es obligatorio.';
        document.getElementById('solicitanteNombre').classList.add('error');
        hasError = true;
      }
      
      const emailRegex = /^[\w-\.]+@([\w-]+\.)+[\w-]{2,4}$/;
      if (!solicitanteEmail) {
        document.getElementById('solicitanteEmailError').textContent = 'El email del solicitante es obligatorio.';
        document.getElementById('solicitanteEmail').classList.add('error');
        hasError = true;
      } else if (!emailRegex.test(solicitanteEmail)) {
        document.getElementById('solicitanteEmailError').textContent = 'El formato del email no es valido.';
        document.getElementById('solicitanteEmail').classList.add('error');
        hasError = true;
      }
      
      if (hasError) return;
      
      // Deshabilitar boton
      const btnGuardar = document.getElementById('btnGuardar');
      btnGuardar.disabled = true;
      btnGuardar.innerHTML = '<i class="fas fa-spinner fa-spin"></i> Guardando...';
      
      try {
        const response = await API.post('/api/solicitudes', {
          titulo,
          descripcion,
          tipo,
          prioridad,
          solicitanteNombre,
          solicitanteEmail
        });
        
        if (response.success) {
          showAlert('alertContainer', response.message, 'success');
          setTimeout(() => {
            window.location.href = `detalle-solicitud.html?id=${response.data._id}`;
          }, 1500);
        }
      } catch (error) {
        showAlert('alertContainer', error.message || 'Error al registrar la solicitud.', 'danger');
        btnGuardar.disabled = false;
        btnGuardar.innerHTML = '<i class="fas fa-save"></i> Guardar Solicitud';
      }
    });
  </script>
</body>
</html>
