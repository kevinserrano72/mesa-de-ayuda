<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Mesa de Ayuda Lite - Iniciar Sesion</title>
  <link rel="stylesheet" href="styles.css">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body>
  <!-- ============================================
       LOGIN PAGE - RF01
       ============================================ -->
  <div class="login-container">
    <div class="login-card">
      <div class="login-header">
        <div class="icon">
          <i class="fas fa-headset"></i>
        </div>
        <h1>Mesa de Ayuda Lite</h1>
        <p>Sistema de Gestion de Solicitudes</p>
      </div>

      <div id="alertContainer"></div>

      <form id="loginForm">
        <div class="form-group">
          <label for="email">Correo Electronico <span class="required">*</span></label>
          <input 
            type="email" 
            id="email" 
            class="form-control" 
            placeholder="admin@empresa.com"
            required
          >
          <div class="form-error" id="emailError"></div>
        </div>

        <div class="form-group">
          <label for="password">Contrasena <span class="required">*</span></label>
          <div class="password-field">
            <input 
              type="password" 
              id="password" 
              class="form-control" 
              placeholder="Minimo 8 caracteres, mayuscula, numero y especial"
              required
              autocomplete="current-password"
              maxlength="128"
            >
            <button type="button" class="password-toggle" id="togglePassword" title="Mostrar u ocultar contrasena" aria-label="Mostrar u ocultar contrasena">
              <i class="fas fa-eye" id="togglePasswordIcon"></i>
            </button>
          </div>
          <ul class="password-rules" id="passwordRules" aria-live="polite">
            <li data-rule="len">Entre 8 y 128 caracteres</li>
            <li data-rule="upper">Al menos una mayuscula</li>
            <li data-rule="lower">Al menos una minuscula</li>
            <li data-rule="digit">Al menos un numero</li>
            <li data-rule="special">Al menos un caracter especial</li>
          </ul>
          <div class="form-error" id="passwordError"></div>
        </div>

        <button type="submit" class="btn btn-primary btn-block btn-lg" id="btnLogin">
          <i class="fas fa-sign-in-alt"></i>
          Iniciar Sesion
        </button>
      </form>

      <div class="mt-3 text-center">
        <small style="color: var(--text-secondary);">
          Tras ejecutar <code>npm run seed</code>: admin@empresa.com / Admin123!
        </small>
      </div>
    </div>
  </div>

  <script src="app.js"></script>
  <script>
    // Verificar si ya esta autenticado y boton mostrar contrasena
    document.addEventListener('DOMContentLoaded', () => {
      if (Auth.isAuthenticated()) {
        window.location.href = 'dashboard.html';
      }

      const toggleBtn = document.getElementById('togglePassword');
      const passInput = document.getElementById('password');
      const passIcon = document.getElementById('togglePasswordIcon');
      if (toggleBtn && passInput && passIcon) {
        toggleBtn.addEventListener('click', () => {
          const show = passInput.type === 'password';
          passInput.type = show ? 'text' : 'password';
          passIcon.classList.toggle('fa-eye', !show);
          passIcon.classList.toggle('fa-eye-slash', show);
          toggleBtn.setAttribute('aria-pressed', show ? 'true' : 'false');
        });
      }

      if (passInput) {
        passInput.addEventListener('input', () => updateLoginPasswordHints(passInput.value));
      }
    });

    // Manejar formulario de login
    document.getElementById('loginForm').addEventListener('submit', async (e) => {
      e.preventDefault();
      
      const email = document.getElementById('email').value.trim();
      const password = document.getElementById('password').value;
      const btnLogin = document.getElementById('btnLogin');
      
      // Limpiar errores
      document.getElementById('emailError').textContent = '';
      document.getElementById('passwordError').textContent = '';
      document.getElementById('email').classList.remove('error');
      document.getElementById('password').classList.remove('error');
      
      // Validaciones
      let hasError = false;
      
      // Validar email
      const emailRegex = /^[\w-\.]+@([\w-]+\.)+[\w-]{2,4}$/;
      if (!email) {
        document.getElementById('emailError').textContent = 'El email es obligatorio.';
        document.getElementById('email').classList.add('error');
        hasError = true;
      } else if (!emailRegex.test(email)) {
        document.getElementById('emailError').textContent = 'Formato de email invalido.';
        document.getElementById('email').classList.add('error');
        hasError = true;
      }
      
      // Validar contrasena (longitud; fortaleza se muestra en la lista de requisitos)
      const passMsg = validateLoginPasswordSubmit(password);
      if (passMsg) {
        document.getElementById('passwordError').textContent = passMsg;
        document.getElementById('password').classList.add('error');
        hasError = true;
      }
      
      if (hasError) return;
      
      // Deshabilitar boton
      btnLogin.disabled = true;
      btnLogin.innerHTML = '<i class="fas fa-spinner fa-spin"></i> Iniciando...';
      
      try {
        const response = await API.post('/api/auth/login', { email, password });
        
        if (response.success) {
          Auth.login(response.data.token, response.data.usuario);
          showAlert('alertContainer', 'Inicio de sesion exitoso. Redirigiendo...', 'success');
          setTimeout(() => {
            window.location.href = 'dashboard.html';
          }, 1000);
        }
      } catch (error) {
        showAlert('alertContainer', error.message || 'Error al iniciar sesion.', 'danger');
        btnLogin.disabled = false;
        btnLogin.innerHTML = '<i class="fas fa-sign-in-alt"></i> Iniciar Sesion';
      }
    });
  </script>
</body>
</html>
